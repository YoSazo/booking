name: Build Marketel iOS IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "ios-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    defaults:
      run:
        working-directory: marketel-frontdesk-ios

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            marketel-frontdesk-ios/package-lock.json
            guest-lodge-backend/frontdesk/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Front Desk dependencies
        working-directory: guest-lodge-backend/frontdesk
        run: npm ci

      - name: Build Front Desk into the native bundle
        working-directory: guest-lodge-backend/frontdesk
        run: npm run build:native

      - name: Synchronize the iOS project
        run: npm run sync

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.4.app

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -resolvePackageDependencies

      - name: Build unsigned device app
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath ios/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package standard IPA
        run: |
          test -d ios/DerivedData/Build/Products/Release-iphoneos/App.app
          mkdir -p ios/output/Payload
          cp -R ios/DerivedData/Build/Products/Release-iphoneos/App.app ios/output/Payload/
          (
            cd ios/output
            zip -qry Marketel-Front-Desk.ipa Payload
          )
          unzip -t ios/output/Marketel-Front-Desk.ipa

      - name: Upload installable IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Marketel-Front-Desk-IPA
          path: marketel-frontdesk-ios/ios/output/Marketel-Front-Desk.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Publish tagged dogfood release
        if: startsWith(github.ref, 'refs/tags/ios-v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              marketel-frontdesk-ios/ios/output/Marketel-Front-Desk.ipa \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              marketel-frontdesk-ios/ios/output/Marketel-Front-Desk.ipa \
              --title "Marketel Front Desk iOS ${GITHUB_REF_NAME#ios-v}" \
              --notes "Device-testing build of Marketel Front Desk 3.14 with durable guest-action retries, visible live-booking readiness, truthful email and card-hold completion states, owner-controlled unanswered-booking rules, and Front Desk Assistant texting. APNs delivery requires a push-enabled Apple profile and the production backend APNs configuration." \
              --prerelease
          fi
