# XcodeGen spec — the .xcodeproj is generated fresh in CI from this file, so there
# is no hand-written pbxproj to drift or break. Edit here, not in Xcode.
name: Guestel
options:
  bundleIdPrefix: com.bookmarketel
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: YAS2Z7ZY3M

packages:
  Stripe:
    url: https://github.com/stripe/stripe-ios
    from: "26.0.0"

targets:
  Guestel:
    type: application
    platform: iOS
    sources:
      - path: Guestel
    dependencies:
      - package: Stripe
        product: StripePaymentSheet
      - target: GuestelClip
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bookmarketel.guestel
        PRODUCT_NAME: Guestel
        GENERATE_INFOPLIST_FILE: "YES"
        # Only standard/exempt encryption (HTTPS, Stripe) — declare it so App Store
        # Connect stops asking the export-compliance question on every build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_CFBundleDisplayName: Guestel
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSCameraUsageDescription: "Scan your card to book faster."
        # Status pushes carry content-available so a release/confirmation can
        # refresh the saved reservation before the guest reopens Guestel.
        INFOPLIST_KEY_UIBackgroundModes:
          - remote-notification
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGN_ENTITLEMENTS: Guestel/Guestel.entitlements
        # Manual distribution signing — every build is a CI Release archive.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        DEVELOPMENT_TEAM: YAS2Z7ZY3M
        PROVISIONING_PROFILE_SPECIFIER: "Marketel Guestel App Store"

  GuestelClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: GuestelClip
      - path: Guestel/Theme.swift
      - path: Guestel/BookingAPI.swift
      - path: Guestel/GuestelHandoff.swift
      - path: Guestel/Assets.xcassets
      - path: Guestel/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bookmarketel.guestel.Clip
        PRODUCT_NAME: GuestelClip
        GENERATE_INFOPLIST_FILE: "YES"
        # Only standard/exempt encryption (HTTPS, Stripe) — declare it so App Store
        # Connect stops asking the export-compliance question on every build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: "NO"
        INFOPLIST_KEY_CFBundleDisplayName: Guestel
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGN_ENTITLEMENTS: GuestelClip/GuestelClip.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        DEVELOPMENT_TEAM: YAS2Z7ZY3M
        PROVISIONING_PROFILE_SPECIFIER: "Marketel Guestel Clip App Store"
