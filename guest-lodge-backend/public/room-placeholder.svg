<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Room image placeholder</title>
  <desc id="desc">A calm, neutral illustration of a furnished guest room.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f7f4"/>
      <stop offset="1" stop-color="#dce9e1"/>
    </linearGradient>
    <linearGradient id="duvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e7efe9"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfd9ce"/>
      <stop offset="1" stop-color="#e9f2ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#355e4b" flood-opacity=".16"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#wall)"/>
  <path d="M0 630h1200v170H0z" fill="#c9d8ce"/>
  <path d="M0 631h1200" stroke="#b2c7ba" stroke-width="8"/>

  <!-- Window and curtains make the scene read as an interior at a glance. -->
  <rect x="126" y="90" width="330" height="255" rx="10" fill="#f9fcfa" stroke="#9db5a7" stroke-width="12"/>
  <rect x="148" y="112" width="286" height="211" fill="url(#window)"/>
  <path d="M291 112v211M148 217h286" stroke="#f8fbf9" stroke-width="10" opacity=".9"/>
  <path d="M103 72h75v300h-94c39-73 39-226 19-300zm376 0h-75v300h94c-39-73-39-226-19-300z" fill="#789989" opacity=".72"/>

  <!-- A complete bed, pillows and folded throw replace the ambiguous icon. -->
  <g filter="url(#shadow)">
    <rect x="235" y="335" width="690" height="286" rx="34" fill="#789989"/>
    <rect x="208" y="420" width="744" height="218" rx="34" fill="url(#duvet)"/>
    <rect x="255" y="365" width="285" height="138" rx="34" fill="#fbfdfc" stroke="#d4e1d9" stroke-width="8"/>
    <rect x="620" y="365" width="285" height="138" rx="34" fill="#fbfdfc" stroke="#d4e1d9" stroke-width="8"/>
    <path d="M209 504h742v134H209z" fill="#f7faf8"/>
    <path d="M209 565h742v73H209z" fill="#aac1b3"/>
    <path d="M280 637v42m600-42v42" stroke="#547563" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- Bedside table and lamp. -->
  <g>
    <rect x="978" y="465" width="142" height="176" rx="18" fill="#6e8f7e"/>
    <rect x="993" y="502" width="112" height="8" rx="4" fill="#b9cfc2"/>
    <circle cx="1049" cy="545" r="8" fill="#dce9e1"/>
    <path d="M1049 464V337" stroke="#527361" stroke-width="14" stroke-linecap="round"/>
    <path d="M990 352h118l-24-78h-70z" fill="#f8fbf9" stroke="#9db5a7" stroke-width="8" stroke-linejoin="round"/>
  </g>

  <!-- Small plant softens the otherwise neutral scene. -->
  <g transform="translate(72 488)">
    <path d="M68 62C18 34 22 4 25 0c37 5 54 26 43 62zm8 0c46-37 78-18 82-14-13 36-40 46-82 14zm-2-5C59 8 79-9 84-11c22 31 17 55-10 68z" fill="#4d7d64"/>
    <path d="M35 65h78l-13 100H48z" fill="#91aa9a"/>
  </g>
</svg>
